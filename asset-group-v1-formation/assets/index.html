<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Group Builder</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'none'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<meta http-equiv="Referrer-Policy" content="no-referrer">
<meta http-equiv="refresh" content="0; url=asset_group_builder.html">
<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #e4e7eb;
    --text: #1a2332;
    --muted: #6b7380;
    --accent: #2d5bff;
  }
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: min(520px, 100%);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 24px;
    line-height: 1.2;
    font-weight: 650;
  }
  p {
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
  }
  a {
    display: inline-flex;
    align-items: center;
    min-height: 40px;
    padding: 9px 14px;
    border-radius: 6px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
  }
</style>
</head>
<body>
<main>
  <h1>Asset Group Builder</h1>
  <p>Opening the local builder app.</p>
  <a href="asset_group_builder.html">Open Asset Group Builder</a>
</main>
</body>
</html>
